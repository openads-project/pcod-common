stages:
  - checks
  - build
  - package
  - test

license:headers:
  stage: checks
  image: python:3.12-bookworm
  script:
    - python3 scripts/check_license_headers.py

versions:consistent:
  stage: checks
  image: python:3.12-bookworm
  script:
    - python3 scripts/check_versions.py

lint:python:
  stage: checks
  image: python:3.12-bookworm
  before_script:
    - python3 -m pip install "black==26.3.1" "flake8==7.3.0" flake8-docstrings flake8-import-order flake8-quotes
  script:
    - black --check --line-length=130 python scripts
    - flake8 --config=.flake8 python scripts

format:cpp:
  stage: checks
  image: ubuntu:24.04
  before_script:
    - apt-get update
    - apt-get install -y clang-format-18
  script:
    - clang-format-18 --dry-run --Werror $(find csrc include src tests -type f \( -name '*.cpp' -o -name '*.cu' -o -name '*.hpp' \))

doxygen:docs:
  stage: checks
  image: ubuntu:24.04
  before_script:
    - apt-get update
    - apt-get install -y ca-certificates doxygen git graphviz
    - git clone --depth 1 --branch v2.4.1 https://github.com/jothepro/doxygen-awesome-css.git doxygen-awesome-css
  script:
    - doxygen Doxyfile

build:gcc:
  stage: build
  image: ubuntu:24.04
  script:
    - apt-get update
    - apt-get install -y cmake g++ pkg-config libyaml-cpp-dev python3 python3-yaml
    - CC=gcc CXX=g++ cmake -S . -B build-gcc -DPCOD_COMMON_BUILD_TESTS=ON
    - cmake --build build-gcc
    - ctest --test-dir build-gcc --output-on-failure
    - cmake --install build-gcc --prefix build-gcc/install
    - cmake -S tests/cmake_package -B build-package-test -DCMAKE_PREFIX_PATH="$CI_PROJECT_DIR/build-gcc/install"
    - cmake --build build-package-test
    - ctest --test-dir build-package-test --output-on-failure

build:clang:
  stage: build
  image: ubuntu:24.04
  script:
    - apt-get update
    - apt-get install -y cmake clang pkg-config libyaml-cpp-dev python3 python3-yaml
    - CC=clang CXX=clang++ cmake -S . -B build-clang -DPCOD_COMMON_BUILD_TESTS=ON
    - cmake --build build-clang
    - ctest --test-dir build-clang --output-on-failure

build:cuda-fallback:
  stage: build
  image: ubuntu:24.04
  script:
    - apt-get update
    - apt-get install -y cmake g++ pkg-config libyaml-cpp-dev
    - cmake -S . -B build-cuda-fallback -DPCOD_COMMON_BUILD_TESTS=OFF -DPCOD_COMMON_ENABLE_CUDA=ON
    - cmake --build build-cuda-fallback

package:python:
  stage: package
  image: python:3.12-bookworm
  before_script:
    - python3 -m pip install --upgrade pip
    - python3 -m pip install build twine
  script:
    - python3 -m build
    - python3 -m twine check dist/*
    - python3 -m venv /tmp/pcod-wheel-venv
    - /tmp/pcod-wheel-venv/bin/pip install PyYAML
    - /tmp/pcod-wheel-venv/bin/pip install --no-deps dist/*.whl
    - (cd /tmp && /tmp/pcod-wheel-venv/bin/python "$CI_PROJECT_DIR/scripts/verify_installed_package.py" "$(cat "$CI_PROJECT_DIR/VERSION")")
    - python3 -m venv /tmp/pcod-sdist-venv
    - /tmp/pcod-sdist-venv/bin/pip install PyYAML
    - /tmp/pcod-sdist-venv/bin/pip install --no-deps dist/*.tar.gz
    - (cd /tmp && /tmp/pcod-sdist-venv/bin/python "$CI_PROJECT_DIR/scripts/verify_installed_package.py" "$(cat "$CI_PROJECT_DIR/VERSION")")
  artifacts:
    paths:
      - dist/

test:sanitizers:
  stage: test
  image: ubuntu:24.04
  variables:
    ASAN_OPTIONS: detect_leaks=0
  script:
    - apt-get update
    - apt-get install -y cmake g++ pkg-config libyaml-cpp-dev python3 python3-yaml
    - cmake -S . -B build-sanitizers -DPCOD_COMMON_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined
    - cmake --build build-sanitizers
    - ctest --test-dir build-sanitizers --output-on-failure

test:python:
  stage: test
  image: python:3.12-bookworm
  before_script:
    - apt-get update
    - apt-get install -y cmake g++ pkg-config libyaml-cpp-dev
    - python3 -m pip install --upgrade pip
    - python3 -m pip install -e ".[dev]"
  script:
    - pytest -q
