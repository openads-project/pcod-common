[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pcod-common"
version = "1.0.0"
description = "Shared preprocessing/postprocessing utilities for point cloud object detection."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "Bastian Lampe", email = "bastian.lampe@rwth-aachen.de" }
]
maintainers = [
  { name = "Bastian Lampe", email = "bastian.lampe@rwth-aachen.de" }
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Operating System :: POSIX :: Linux",
]
dependencies = [
  "ninja>=1.11",
  "torch>=2.0",
  "torchvision>=0.15",
  "numpy>=1.25",
  "PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/openads-project/pcod-common"
Repository = "https://github.com/openads-project/pcod-common"
Issues = "https://github.com/openads-project/pcod-common/issues"

[project.optional-dependencies]
dev = [
  "black==26.3.1",
  "flake8==7.3.0",
  "flake8-docstrings",
  "flake8-import-order",
  "flake8-quotes",
  "pytest>=7.4",
]

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
exclude = ["tests*"]
