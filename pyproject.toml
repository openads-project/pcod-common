[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pcod-common"
version = "0.1.0"
description = "Shared preprocessing/postprocessing utilities for point cloud object detection."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
  { name = "Bastian Lampe", email = "bastian.lampe@rwth-aachen.de" }
]
maintainers = [
  { name = "Bastian Lampe", email = "bastian.lampe@rwth-aachen.de" }
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: POSIX :: Linux",
]
dependencies = [
  "torch>=2.0",
  "torchvision>=0.15",
  "numpy>=1.25",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "black==26.3.1",
  "flake8==7.3.0",
  "flake8-docstrings",
  "flake8-import-order",
  "flake8-quotes",
  "pytest>=7.4",
]

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
