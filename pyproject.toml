[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pcod-common"
version = "0.1.0"
description = "Shared preprocessing/postprocessing utilities for point cloud object detection."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Institute for Automotive Engineering (ika), RWTH Aachen University", email = "opensource@ika.rwth-aachen.de" }
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
]
dependencies = [
  "torch>=2.0",
  "torchvision>=0.15",
  "numpy>=1.25",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
]

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]

[tool.ruff]
line-length = 130

[tool.ruff.lint]
select = ["I", "W", "D205"]

[tool.ruff.format]
quote-style = "preserve"
