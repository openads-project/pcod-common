name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  license-headers:
    name: License headers
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Check source license headers
        run: python3 scripts/check_license_headers.py

  build-cmake:
    name: CMake build
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ pkg-config libyaml-cpp-dev
      - name: Configure
        run: cmake -S . -B build -DPCOD_COMMON_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build

  unit-tests:
    name: C++ and Python tests
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ pkg-config libyaml-cpp-dev
      - name: Configure CMake
        run: cmake -S . -B build -DPCOD_COMMON_BUILD_TESTS=ON
      - name: Build C++ tests
        run: cmake --build build
      - name: Install Python package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run C++ tests
        run: ctest --test-dir build --output-on-failure
      - name: Run Python tests
        run: pytest -q
