name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repository-checks:
    name: Repository checks
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install check tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-18 doxygen graphviz
          python -m pip install "black==26.3.1" "flake8==7.3.0" flake8-docstrings flake8-import-order flake8-quotes
      - name: Check source license headers
        run: python scripts/check_license_headers.py
      - name: Check project versions
        run: python scripts/check_versions.py
      - name: Lint Python
        run: |
          black --check --line-length=130 python scripts
          flake8 --config=.flake8 python scripts
      - name: Check C++ and CUDA formatting
        run: clang-format-18 --dry-run --Werror $(find csrc include src tests -type f \( -name '*.cpp' -o -name '*.cu' -o -name '*.hpp' \))
      - name: Check Doxygen documentation
        run: |
          git clone --depth 1 --branch v2.4.1 https://github.com/jothepro/doxygen-awesome-css.git doxygen-awesome-css
          doxygen Doxyfile

  cmake:
    name: CMake (${{ matrix.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC
            packages: g++
            cc: gcc
            cxx: g++
            cmake_args: ""
            run_tests: true
          - name: Clang
            packages: clang
            cc: clang
            cxx: clang++
            cmake_args: ""
            run_tests: true
          - name: ASan and UBSan
            packages: g++
            cc: gcc
            cxx: g++
            cmake_args: -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined
            run_tests: true
          - name: CUDA fallback
            packages: g++
            cc: gcc
            cxx: g++
            cmake_args: -DPCOD_COMMON_ENABLE_CUDA=ON
            run_tests: false
    env:
      ASAN_OPTIONS: detect_leaks=0
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ${{ matrix.packages }} pkg-config libyaml-cpp-dev python3 python3-yaml
      - name: Configure
        run: cmake -S . -B build -DPCOD_COMMON_BUILD_TESTS=${{ matrix.run_tests }} ${{ matrix.cmake_args }}
      - name: Build
        run: cmake --build build --parallel 2
      - name: Run C++ tests
        if: matrix.run_tests
        run: ctest --test-dir build --output-on-failure
      - name: Test installed CMake package
        if: matrix.name == 'GCC'
        run: |
          cmake --install build --prefix build/install
          cmake -S tests/cmake_package -B build-package-test -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/build/install"
          cmake --build build-package-test
          ctest --test-dir build-package-test --output-on-failure

  python-tests:
    name: Python 3.12
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run Python tests
        run: pytest -q
      - name: Install C++ contract dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ pkg-config libyaml-cpp-dev
      - name: Run Python/C++ contract test
        run: |
          python3 -c "import torch, torchvision"
          cmake -S . -B build-contract -DPCOD_COMMON_BUILD_TESTS=ON
          cmake --build build-contract --target pcod_common_test_py_cpp_contract --parallel 2
          ctest --test-dir build-contract -R '^pcod_common_test_py_cpp_contract$' --output-on-failure

  python-package:
    name: Python distributions
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build tools
        run: python -m pip install --upgrade pip build twine
      - name: Build and check distributions
        run: |
          python -m build
          python -m twine check dist/*
      - name: Validate installed wheel
        run: |
          python -m venv /tmp/pcod-wheel-venv
          /tmp/pcod-wheel-venv/bin/pip install PyYAML
          /tmp/pcod-wheel-venv/bin/pip install --no-deps dist/*.whl
          cd /tmp
          /tmp/pcod-wheel-venv/bin/python "$GITHUB_WORKSPACE/scripts/verify_installed_package.py" "$(cat "$GITHUB_WORKSPACE/VERSION")"
      - name: Validate installed source distribution
        run: |
          python -m venv /tmp/pcod-sdist-venv
          /tmp/pcod-sdist-venv/bin/pip install PyYAML
          /tmp/pcod-sdist-venv/bin/pip install --no-deps "$GITHUB_WORKSPACE"/dist/*.tar.gz
          cd /tmp
          /tmp/pcod-sdist-venv/bin/python "$GITHUB_WORKSPACE/scripts/verify_installed_package.py" "$(cat "$GITHUB_WORKSPACE/VERSION")"
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
